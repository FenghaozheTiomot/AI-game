<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SECURE_MESSENGER</title>
    <style>
        body { background-color: #0a0a0a; color: #00ff00; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px dashed #005500; padding-bottom: 10px; margin-bottom: 20px; }
        button { background: #003300; color: #00ff00; border: 1px solid #00ff00; padding: 8px 15px; cursor: pointer; font-family: inherit;}
        button:hover { background: #00ff00; color: #000; }
        
        .main-container { display: flex; gap: 20px; max-width: 800px; }
        .panel { border: 1px solid #005500; background: #001100; padding: 20px; flex: 1;}
        
        .profile-section { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #003300; }
        .avatar-img { width: 80px; height: 80px; border: 2px solid #00ff00; border-radius: 10px; background-color: #000; object-fit: cover;}
        
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1;}
        input, textarea { background: #000; color: #00ff00; border: 1px solid #00ff00; padding: 10px; font-family: inherit; font-size: 14px;}
        input:focus, textarea:focus { outline: none; background: #002200; }
        
        #global-clipboard {
            position: fixed; top: 80px; right: 20px; width: 250px; height: calc(100vh - 120px);
            background: rgba(0, 17, 0, 0.9); border: 2px solid #ffaa00; padding: 15px;
            box-shadow: -5px 5px 15px rgba(0,0,0,0.8); overflow-y: auto; z-index: 1000;
        }
        .clipboard-item { cursor: pointer; text-decoration: underline; margin-bottom: 10px; color: #ffaa00; list-style: square;}
        .clipboard-item:hover { color: #fff; background-color: #331100; }
    </style>
</head>
<body>
    <script id="player-data-store" type="application/json">
        {{ player | tojson | safe }}
    </script>

    <script>
        const player_data = JSON.parse(document.getElementById('player-data-store').textContent);
    </script>

    <div class="header">
        <h2>>>> SECURE_MESSENGER</h2>
        <button onclick="window.location.href='/'">[X] Return to Desktop</button>
    </div>

    <div class="main-container">
        <div class="panel">
            <div class="profile-section">
                <img id="avatar" class="avatar-img" src="https://api.dicebear.com/7.x/identicon/svg?seed=Unknown&backgroundColor=000000" alt="Avatar">
                <div class="input-group">
                    <label>Recipient ID (Phone / Email / Handle):</label>
                    <input type="text" id="target-id" placeholder="Enter contact ID..." oninput="checkAvatar()">
                </div>
            </div>

            <div class="input-group">
                <label>Message Content (Click right panel clue to auto-generate):</label>
                <textarea id="message-content" rows="10" placeholder="Type here, or click a clue in the buffer to synthesize dialogue..."></textarea>
            </div>
            <button onclick="executeChat()" style="margin-top: 15px; width: 100%; font-size: 16px; font-weight: bold;">[✉] TRANSMIT PACKET</button>
        </div>
    </div>

    <div id="global-clipboard">
        <h3 style="margin-top: 0; color: #ffaa00;">[ 📌 MEMORY BUFFER ]</h3>
        <p style="color: #888; font-size: 12px;">Click a string to synthesize dialogue strategy.</p>
        <ul id="clue-list"></ul>
    </div>

    <script>
        let npcMemory = {};
        
        // This variable is updated by fetchTemplate to remember which clue is currently active
        let activeClue = "";

        async function executeChat() {
            const target = document.getElementById("target-id").value;
            let phase = npcMemory[target] || "phase_01_probe"; 

            const response = await fetch('/api/send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: target, clue: activeClue, current_phase: phase })
            });
            
            const data = await response.json();
            
            if (data.status === "success") {
                npcMemory[target] = data.next_phase; 
                document.getElementById("message-content").value += `\n\n--- TARGET RESPONSE ---\n` + data.npc_replies.join("\n");
            } else {
                document.getElementById("message-content").value += `\n\n[SYSTEM]: ${data.message}`;
            }
        }
        
        const avatarDatabase = {
            "Broker_Ghost": "https://api.dicebear.com/7.x/bottts/svg?seed=Ghost&backgroundColor=000000"
        };
        const defaultAvatar = "https://api.dicebear.com/7.x/identicon/svg?seed=Unknown&backgroundColor=000000";

        function checkAvatar() {
            const targetInput = document.getElementById("target-id").value.trim();
            const avatarImg = document.getElementById("avatar");
            avatarImg.src = avatarDatabase[targetInput] ? avatarDatabase[targetInput] : defaultAvatar;
        }

        window.onload = function() {
            loadClipboard();
            if (player_data.current_day >= 6) {
                document.body.style.animation = "glitch 0.3s infinite";
            }
        };

        function loadClipboard() {
            const list = document.getElementById("clue-list");
            list.innerHTML = "";
            let clues = JSON.parse(localStorage.getItem('osint_clues')) || [];
            clues.forEach(text => {
                list.innerHTML += `<li class="clipboard-item" onclick="fetchTemplate('${text}')">${text}</li>`;
            });
        }

        async function fetchTemplate(clue) {
            const target = document.getElementById("target-id").value.trim();
            const contentBox = document.getElementById("message-content");

            if (!target) {
                contentBox.value = "[INTERCEPT]: Please input a Recipient ID first. Synthesis requires target parameters.";
                return;
            }

            contentBox.value = `Accessing database... Synthesizing psychological vector for [${target}] using [${clue}]...`;
            activeClue = clue;

            setTimeout(() => {
                contentBox.value = `I have information regarding: ${clue}. \nAre you willing to negotiate?`;
            }, 400); 
        }
    </script>
</body>
</html>
